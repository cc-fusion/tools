<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Editor</title>
  <style>
    #textarea {
      position: absolute;
      top: 10px;
      left: 10px;
      width: calc(100% - 10px);
      min-height: calc(100% - 10px);
      resize: none;
      background: none;
      font-size: 16px;
      padding: 0;
      margin: 0;
      border: 0;
      outline: 0;
      font-family: monospace, monospace;
      white-space: pre-wrap;
      box-sizing: border-box;
      word-wrap: break-word;
      field-sizing: content;
    }
  </style>
</head>

<body>
  <p id="textarea" contenteditable="true"></p>
  <script>
    function escapeHTML(text) {
      let pre = document.createElement("pre");
      pre.innerText = text;
      return pre.innerHTML;
    }
    function parseMathParts(arr) {
      // 1. parenthesis
      console.log("Math helper recieved", arr)
      let i = 0
      while (i < arr.length) {
        console.log("Parsing", arr[i], "Arr = ", arr)
        if (arr[i] == "(") {
          let startIdx = i
          while (i < arr.length && arr[i] != ")") {
            i++
          }
          let endIdx = i
          if (i >= arr.length) console.warn("Closed an unclosed parenthesis")
          arr = [
            ...arr.slice(0,startIdx),
            parseMathParts(arr.slice(startIdx, endIdx)),
            ...arr.slice(endIdx, arr.length)
          ]
        } else {i++}
      }
      // 2. exponentials
      // 3. multiplication/division
      // 4. addition/subtraction
      let equations = [
        (n,a,b) => (n=="^" || n=="**")?(a**b):null,
        (n,a,b) => n=="/"?a/b:(n=="*"?a*b:null),
        (n,a,b) => n=="-"?a-b:(n=="+"?a+b:null)
      ]
      for (let equationFn of equations) {
        i = 0
        while (i < arr.length) {
          console.log("Parsing", arr[i], "Arr = ", arr)
          let equationResult = equationFn(arr[i], arr[i-1], arr[i+1])
          if (equationResult !== null) {
            let result = equationResult
            arr = [
              ...arr.slice(0,i-1),
              result,
              ...arr.slice(i+2, arr.length)
            ]
            console.log("Parsed", arr[i], "Arr = ", arr)
          } else {i++}
        }
      }
      console.log("Arr = ", arr)
      return arr
    }
    function getMathParts(text) {
      let splitParts = []
      let i = 0
      while (i < text.length) {
        console.log("Trying " + text[i])
        let currentNum = ""
        while (i < text.length && /\d|\./.test(text[i])) {
          currentNum += text[i]
          i++
        }
        if (currentNum) {
          splitParts.push(parseFloat(currentNum))
          continue
        }
        let currentOperation = ""
        while (i < text.length && /[+\-*\/^\(\)]/.test(text[i])) {
          currentOperation += text[i]
          i++
        }
        splitParts.push(currentOperation)
        if (!currentOperation) throw "This should not happen"
      }
      return splitParts
    }
    function parseMath(text) {
      if (/[^0-9+\-*\/^.\(\)]/.test(text)) throw "Invalid character in simple math parser"
      return parseMathParts(getMathParts(text))
    }
    let currentSuggestion
    textarea.addEventListener("keydown", (e) => {
      if (e.key === "Tab" && currentSuggestion) {
        textarea.value = currentSuggestion
        e.preventDefault()
      }
    })
    function getCaretPosition(element) {
      let position = -1
      let selection = window.getSelection()
      if (selection.rangeCount > 0) {
        let range = selection.getRangeAt(0)
        let cloneRange = range.cloneRange()
        cloneRange.selectNodeContents(element)
        cloneRange.setEnd(range.endContainer, range.endOffset)
        position = cloneRange.toString().length
      }
      return position

      return tempEl.innerHTML
    }
    textarea.addEventListener("input", (e) => {
      textarea.innerHTML = deleteAllHTML(textarea.innerHTML, "b")
      let caretPos = getCaretPosition(textarea)
      let plainText = textarea.innerText
      currentSuggestion = null
      let mathExpr = textarea.innerText.slice(0,caretPos).match(/([0-9]+[+\-*\/^.\(\)]*)+=$/)
      console.log(mathExpr)
      let extension = ""
